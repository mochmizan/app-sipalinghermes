global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['mizan-node-exporter:9100']

  - job_name: hermes-app
    metrics_path: /metrics
    static_configs:
      - targets: ['mizan-app:5173']

  - job_name: alertmanager
    static_configs:
      - targets: ['mizan-alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['mizan-alertmanager:9093']
